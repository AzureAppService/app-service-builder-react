name: Validate React sample

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Export exact locked local-validation prerequisite
        if: github.ref == 'refs/heads/sample-ux-refresh' && runner.os == 'Linux'
        run: mkdir .validation-prerequisites && npm pack vite@8.3.7 --pack-destination .validation-prerequisites
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref == 'refs/heads/sample-ux-refresh' && runner.os == 'Linux'
        with:
          name: exact-local-validation-prerequisite
          path: .validation-prerequisites/*
          include-hidden-files: true
          retention-days: 1
